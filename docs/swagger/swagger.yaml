basePath: /api/v1
definitions:
  ErrorResponse:
    properties:
      error:
        example: invalid argument
        type: string
      message:
        example: failed to decode and validate HTTP request
        type: string
    type: object
  RegisterRequest:
    properties:
      email:
        example: john.doe@example.com
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: securepassword123
        type: string
    required:
    - email
    - password
    type: object
  UserResponse:
    properties:
      created_at:
        example: "2026-09-12T10:42:52Z"
        type: string
      email:
        example: john.doe@example.com
        type: string
      id:
        example: 1
        type: integer
      version:
        example: 1
        type: integer
    type: object
host: 127.0.0.1:5050
info:
  contact: {}
  description: API для приложения Конверт. Для управления личными финансами
  title: Konvert API
  version: "1.0"
paths:
  /users:
    get:
      consumes:
      - application/json
      description: Получение пользователей
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешно полученные пользователи
          schema:
            items:
              $ref: '#/definitions/UserResponse'
            type: array
        "400":
          description: Ошибка валидации данных
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Получение пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Создание нового пользователя в системе
      parameters:
      - description: Тело запроса для регистрации пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданный пользователь
          schema:
            $ref: '#/definitions/UserResponse'
        "400":
          description: Ошибка валидации данных
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Конфликт
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Создание пользователя
      tags:
      - users
swagger: "2.0"
